name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The core suite needs nothing but the standard library.
      - name: Run tests
        run: |
          python tests/test_cloakwall.py
          python tests/test_proxy.py
          python tests/test_scan.py
      - name: Run benchmarks (smoke check)
        run: python benchmarks/bench.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check the PyPI package
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
